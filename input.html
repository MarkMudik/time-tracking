<!DOCTYPE html>
<html>
    <head>
        <title>Time Table</title>
        <link rel="icon" type="image/x-icon" href="./code-16.ico">
    </head>
    <body>
        <h1>Time Table</h1>

        <main>
            <!-- input date -->
            <section>
            <label for="date">Date:</label>
            <input type="date" id="date" name="date">
            </section>

            <!-- recipient -->
            <section>
                <label for="recipient">Recipient</label>
                <select id="recipient" name="recipient">
                    <option value="recipient1">Recipient 1</option>
                    <option value="recipient2">Recipient 2</option>
                </select>
            </section>

            <!-- time input -->
            <section>
                <form>
                    <label for="timeStarted">Start Time:</label>
                    <input type="time" id="timeStarted" name="timeStarted">
                    <label for="timeFinished">Finish Time:</label>
                    <input type="time" id="timeFinished" name="timeFinished">
            </section>
        </main>

        <footer>
            <a href="index.html">Back to index</a>
        </footer>
    </body>
</html>
